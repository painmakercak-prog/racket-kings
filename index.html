<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Racket Kings (Prototype)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#2b1d14;font-family:"Trebuchet MS",Arial Rounded MT Bold,sans-serif;font-weight:bold;max-width:430px;margin:auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:#3a2a1a;user-select:none}
.ol{color:#fff;text-shadow:-1.5px -1.5px 0 #222,1.5px -1.5px 0 #222,-1.5px 1.5px 0 #222,1.5px 1.5px 0 #222,0 2px 0 #222}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(#4a3424,#2e2016);border-bottom:3px solid #1a120c}
#top .av{width:40px;height:40px;border-radius:10px;border:3px solid #222;background:#e9c27a center/cover}
.pill{flex:1;display:flex;align-items:center;background:#1a120ccc;border:2px solid #111;border-radius:14px;height:26px;padding-right:6px;font-size:13px}
.pill img{height:30px;margin:-4px 2px 0 -6px}.pill b{flex:1;text-align:right}
#arena{position:relative;height:38vh;min-height:250px;background:#567 center bottom/cover;overflow:hidden;border-bottom:4px solid #222}
#arena .info{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:18px;z-index:3}
#arena .srv{position:absolute;top:30px;left:0;right:0;text-align:center;font-size:11px;z-index:3}
.unit{position:absolute;bottom:6%;text-align:center;z-index:2}
.unit img{display:block;margin:auto;animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 4px 0 #0005)}
#hero{left:4%}#hero img{height:150px}#foe{right:4%}#foe img{height:140px}#foe.boss img{height:185px}
.hb{width:110px;height:12px;background:#311;border:2px solid #111;border-radius:7px;overflow:hidden;margin:auto}.hb i{display:block;height:100%;background:linear-gradient(#ff6a5a,#c62a1a);transition:width .2s}
#hero .hb i{background:linear-gradient(#8f6,#3a2)}.nm{font-size:12px}
@keyframes bob{50%{transform:translateY(-6px)}}
.lungeR{animation:lr .3s}.lungeL{animation:ll .3s}@keyframes lr{50%{transform:translateX(60px)}}@keyframes ll{50%{transform:translateX(-60px)}}
.hit img{animation:fl .25s!important}@keyframes fl{0%,100%{filter:none}40%{filter:brightness(3) saturate(0)}}
.dmg{position:absolute;font-size:22px;z-index:5;animation:up .9s forwards;pointer-events:none}.dmg.c{font-size:30px;color:#ffd23a}.dmg.p{color:#ff7a6a}
@keyframes up{0%{transform:scale(.5)}20%{transform:scale(1.2)}100%{transform:translateY(-55px);opacity:0}}
#panel{flex:1;overflow-y:auto;background:linear-gradient(#f6ead2,#e8d6b4);padding:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{position:relative;aspect-ratio:1;border:3px solid #222;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 #0003,0 3px 0 #0004}
.tile img{width:72%}.tile .lv{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:12px}.tile .sl{display:none;position:absolute;top:3px;left:6px;font-size:9px;opacity:.7;color:#222}
.r0{background:#c9c9c9}.r1{background:#7fd65a}.r2{background:#4fa3ff}.r3{background:#b56bff}.r4{background:#ffb432}.re{background:#d8c8a8}
.rt0{color:#777}.rt1{color:#3a9a2a}.rt2{color:#1f6fd0}.rt3{color:#8a3ad8}.rt4{color:#d07a00}
.forge{display:flex;align-items:center;gap:8px;margin:8px 0}
.forge img{width:110px;filter:drop-shadow(0 4px 0 #0004)}
.btn{display:block;width:100%;padding:12px;margin:6px 0;border:3px solid #222;border-radius:14px;background:linear-gradient(#ffd75a,#f0a020);box-shadow:inset 0 -5px 0 #0003,0 3px 0 #0005;font:bold 16px "Trebuchet MS",sans-serif;color:#fff;text-shadow:-1px -1px 0 #222,1px -1px 0 #222,-1px 1px 0 #222,1px 1px 0 #222}
.btn:active{transform:translateY(2px)}.btn:disabled{filter:grayscale(1);opacity:.6}
.btn.g{background:linear-gradient(#9be86a,#4cae2a)}.btn.b{background:linear-gradient(#7cc4ff,#2f7ee0)}.btn.r{background:linear-gradient(#ff8a7a,#d0402a)}.btn.sm{padding:8px;font-size:14px}
.card{background:#fffaf0;border:3px solid #222;border-radius:14px;padding:9px;margin:7px 0;box-shadow:0 3px 0 #0003;font-size:13px}
#chat,.chatstrip{background:#2a2a3acc;color:#fff;border-radius:10px;padding:5px 8px;font-size:12px;font-weight:normal}
.chatstrip{margin:6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat{height:150px;overflow-y:auto}#chat div{margin:2px 0}
.ai{font-size:9px;background:#3a6ad0;color:#fff;padding:1px 4px;border-radius:4px;margin-left:3px;font-weight:bold}
.row{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:2px dashed #d8c8a8;font-size:13px}
nav{display:flex;background:linear-gradient(#4a3424,#2e2016);border-top:3px solid #111;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:4px 0 3px;font:bold 11px sans-serif;color:#fff}
nav img{display:block;height:36px;margin:auto;transition:transform .15s}nav button.on{background:#ffffff22}nav button.on img{transform:scale(1.2) translateY(-3px)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#modal .card{width:90%;max-width:380px}
.demo{background:#c62a1a;color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
input{width:100%;padding:10px;font-size:16px;border:3px solid #222;border-radius:10px}
.item{display:flex;gap:10px;align-items:center}.item .tile{width:70px;flex:none}
h3{margin:4px 0}
</style></head><body>
<div id="top"><div class="av" id="av"></div>
<div class="pill ol"><img id="icash"><b id="gd"></b></div><div class="pill ol"><img id="idia"><b id="gm"></b></div><div class="pill ol"><img id="icrate"><b><span id="hm"></span>/<span id="hmax"></span></b></div></div>
<div id="arena"><div class="info ol" id="stg"></div><div class="srv ol"><span id="srvname"></span> · ● <span id="online"></span> online · PWR <span id="pw"></span></div>
<div class="unit" id="hero"><img id="heroimg"><div class="hb"><i id="pbar"></i></div><div class="nm ol">You</div></div>
<div class="unit" id="foe"><img id="foeimg"><div class="hb"><i id="ebar"></i></div><div class="nm ol" id="foename"></div></div></div>
<div id="panel"></div>
<nav><button data-t="forge"><img data-i="bench">Armory</button><button data-t="battle"><img data-i="n_fist">Hits</button><button data-t="shop"><img data-i="n_shop">Shop</button><button data-t="guild"><img data-i="n_fam">Family</button><button data-t="world"><img data-i="n_city">Cities</button></nav>

const SLOTS=['weapon','hat','suit','gloves','shoes','bling'];
const ICON={weapon:['i_tommy','i_pistol','i_bat'],hat:['i_hat'],suit:['i_suit'],gloves:['i_gloves'],shoes:['i_shoes'],bling:['i_ring','i_watch']};
const NOUN={i_tommy:'Tommy Gun',i_pistol:'Revolver',i_bat:'Slugger',i_hat:'Fedora',i_suit:'Pinstripe',i_gloves:'Gloves',i_shoes:'Wingtips',i_ring:'Pinky Ring',i_watch:'Pocket Watch'};
const RAR=['Common','Uncommon','Rare','Epic','Legendary'],RMUL=[1,1.4,2,3,4.5],BASEW=[600,280,90,25,5];
const SERVERS=[{n:'Chicago',base:4200},{n:'New York',base:6100},{n:'Atlantic City',base:2600},{n:'Kansas City (New)',base:900}];
const NAMES1=['Sal','Vinnie','Lucky','Bugsy','Frankie','Tony','Mickey','Nicky','Joey','Lefty','Benny','Rocco','Dutch','Carmine','Fats','Sonny'];
const NAMES2=['Knuckles','TheFish','Two-Times','Bones','Spats','Slick','Pockets','Ace','Moneybags','Nails','Shades','Dimes'];
const GN=['The Moretti Family','Ironside Outfit','Lucky Seven Crew','Velvet Syndicate'];
const FOES=[['e0','Street Thug'],['e1','Crooked Cop'],['e2','Rival Gangster'],['e3','Enforcer'],['e4','Bookie']];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)];
const aiName=()=>pick(NAMES1)+' '+pick(NAMES2);
function newAI(lvl){const l=Math.max(1,lvl+rnd(-8,15));return{name:aiName(),ai:1,lvl:l,power:Math.round(l*l*3+rnd(50,400)),gear:pick(RAR)}}
let S;
function fresh(){return{hammers:25,gold:150,gems:0,forgeLvl:1,stage:1,gear:{},noAds:false,last:Date.now(),server:0,guild:null,members:[],chat:[],gboss:{hp:500000,max:500000,lvl:1},ladder:Array.from({length:15},()=>newAI(20)),auto:false,v:2}}
try{S=JSON.parse(localStorage.getItem('racketkings'))}catch(e){}
if(!S||S.v!==2)S=fresh();
const save=()=>{S.last=Date.now();localStorage.setItem('racketkings',JSON.stringify(S))};
const hmax=()=>40+S.forgeLvl*5,upCost=()=>Math.round(120*Math.pow(1.55,S.forgeLvl-1));
function rarW(){return BASEW.map((w,i)=>i==0?Math.max(100,w-S.forgeLvl*40):w*(1+S.forgeLvl*.25*i))}
function rollRar(){const w=rarW(),t=w.reduce((a,b)=>a+b);let r=Math.random()*t;for(let i=0;i<5;i++){if((r-=w[i])<0)return i}return 0}
const ADJ=['Smooth','Dapper','Crooked','Golden','Midnight','Velvet','Lucky','Iron'];
function makeItem(){const slot=pick(SLOTS),r=rollRar(),lv=S.stage+rnd(0,3),m=RMUL[r]*(1+lv*.25),ic=pick(ICON[slot]);
 const atk=['weapon','gloves','bling'].includes(slot)?Math.round(m*rnd(8,12)):Math.round(m*rnd(1,3));
 const hp=['hat','suit','shoes'].includes(slot)?Math.round(m*rnd(40,60)):Math.round(m*rnd(5,15));
 return{slot,r,lv,atk,hp,ic,name:pick(ADJ)+' '+NOUN[ic]}}
const ipow=i=>i?i.atk*5+i.hp:0;
function stats(){let a=10,h=100;for(const s of SLOTS){const g=S.gear[s];if(g){a+=g.atk;h+=g.hp}}return{atk:a,hp:h,power:a*5+h}}
const sellVal=i=>Math.round((10+i.lv*2)*RMUL[i.r]);
let tab='forge';const $=id=>document.getElementById(id);
function hud(){$('hm').textContent=S.hammers;$('hmax').textContent=hmax();$('gd').textContent=S.gold.toLocaleString();$('gm').textContent=S.gems;$('pw').textContent=stats().power.toLocaleString()}
function modal(h){$('mbody').innerHTML=h;$('modal').style.display='flex'}
function closeM(){$('modal').style.display='none'}
function tileHTML(i,sl){return i?`<div class="tile r${i.r}"><span class="sl">${sl||''}</span><img src="${IMG[i.ic]}"><span class="lv ol">Lv. ${i.lv}</span></div>`:`<div class="tile re"><span class="sl">${sl}</span><img src="${IMG[ICON[sl][0]]}" style="opacity:.25;filter:grayscale(1)"></div>`}
function itemHTML(i){return i?`<div class="item">${tileHTML(i)}<div><b class="rt${i.r}">${i.name}</b><br>${RAR[i.r]} · Lv ${i.lv}<br>ATK ${i.atk} · HP ${i.hp}</div></div>`:'<i>Nothing equipped</i>'}
function forge(){if(S.hammers<1)return;S.hammers--;const it=makeItem(),cur=S.gear[it.slot];window._it=it;const d=ipow(it)-ipow(cur);
 if(S.auto){d>0?equip(true):sell(true);return}
 modal(`<h3 class="ol" style="text-align:center;font-size:22px">Crate Cracked!</h3><div class="card">${itemHTML(it)}</div><small>Currently wearing:</small><div class="card">${itemHTML(cur)}</div>
 <div style="text-align:center;font-size:18px;color:${d>=0?'#3a9a2a':'#c62a1a'}">Power ${d>=0?'+':''}${d}</div>
 <button class="btn g" onclick="equip()">Equip</button><button class="btn" onclick="sell()">Fence it (+$${sellVal(it)})</button>`);
 if(it.r>=3&&S.guild)setTimeout(()=>aiReact('drop',it),1500);save();hud()}
function equip(q){const it=window._it,old=S.gear[it.slot];S.gear[it.slot]=it;if(old)S.gold+=sellVal(old);if(!q)closeM();save();render()}
function sell(q){S.gold+=sellVal(window._it);if(!q)closeM();save();q?hud():render()}
function upgrade(){if(S.gold<upCost())return;S.gold-=upCost();S.forgeLvl++;save();render()}
function toggleAuto(){S.auto=!S.auto;save();render()}
// battle
let B=null;
function enemy(){const boss=S.stage%10==0,m=Math.pow(1.2,S.stage),f=FOES[(S.stage-1)%5];return{boss,img:boss?'boss':f[0],name:boss?'Don Vittorio':f[1],max:Math.round(90*m*(boss?4:1)),atk:Math.round(5*m*(boss?1.6:1))}}
function startFight(){const e=enemy();e.hp=e.max;const s=stats();B={e,php:s.hp,pmax:s.hp};drawFoe()}
function anim(el,c){if(!el)return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function tick(){if(!B)startFight();const s=stats();
 const pd=Math.round(s.atk*(.85+Math.random()*.3)),crit=Math.random()<.12,dd=crit?pd*2:pd;B.e.hp-=dd;anim($('heroimg'),'lungeR');anim($('foe'),'hit');float(dd,'e',crit);
 if(B.e.hp<=0){const g=Math.round(8*Math.pow(1.1,S.stage)*(B.e.boss?5:1)),h=B.e.boss?8:(Math.random()<.5?1:0);
  S.gold+=g;S.hammers=Math.min(S.hammers+h,hmax()+50);if(B.e.boss&&S.guild)aiReact('boss');S.stage++;B=null;save();hud();if(tab=='battle')render();setTimeout(startFight,0);return}
 setTimeout(()=>{if(!B)return;const ed=Math.round(B.e.atk*(.8+Math.random()*.4));B.php-=ed;anim($('foeimg'),'lungeL');anim($('hero'),'hit');float(ed,'p');
  if(B.php<=0){S.stage=Math.max(1,S.stage-1);B=null;save();startFight()}drawB()},300);drawB()}
function float(n,who,c){const a=$('arena');if(!a||!a.appendChild)return;const d=document.createElement('div');d.className='dmg ol'+(c?' c':'')+(who=='p'?' p':'');d.textContent=(c?'CRIT ':'')+n;
 d.style.left=(who=='e'?62:14)+rnd(0,14)+'%';d.style.top=rnd(28,42)+'%';a.appendChild(d);setTimeout(()=>d.remove(),900)}
function drawB(){if(!B)return;$('pbar').style.width=Math.max(0,B.php/B.pmax*100)+'%';$('ebar').style.width=Math.max(0,B.e.hp/B.e.max*100)+'%'}
function drawFoe(){const e=B?B.e:enemy();$('foeimg').src=IMG[e.img];$('foename').textContent=e.name;$('foe').className='unit'+(e.boss?' boss':'');$('stg').innerHTML=`Block ${S.stage}${e.boss?' <span style="color:#ff5a4a">BOSS</span>':''}`}

const SHOP=[['Pouch of Diamonds',100,'gems','$0.99'],['Case of Diamonds',600,'gems','$4.99'],['Vault of Diamonds',1500,'gems','$9.99'],['Crate Bundle (50)',50,'hammers','$1.99'],['Truckload of Crates (300)',300,'hammers','$7.99'],['No-Ads Pass',0,'noads','$2.99']];

function gemSwap(){if(S.gems<50)return;S.gems-=50;S.hammers+=20;save();render()}

let online=0;
function drift(){const sv=SERVERS[S.server],h=new Date().getHours(),di=.6+.4*Math.sin((h-8)/24*2*Math.PI);const t=sv.base*di;online=online?Math.round(online+(t-online)*.05+rnd(-25,25)):Math.round(t);$('online').textContent=online.toLocaleString();$('srvname').textContent=sv.n}
function popLabel(b){return b>5000?'Busy':b>3000?'High':b>1500?'Normal':'Low'}

const CHAT={recruit:['family needs 2 more soldiers for the turf war','anyone hittin the rival boss? hes at {p}%','spare crates? asking for a friend','just cleared block {s}, check my threads'],
 idle:['legendary drop rates are a crime','finally got epic wingtips','who else stuck on block {s}','armory lvl {f} worth it?','mornin family','Don Vittorio hits hard today','one more run before bed','fence epics or keep em?'],

function say(who,ai,txt){S.chat.push({who,ai,txt});if(S.chat.length>60)S.chat.shift();if(tab=='guild')drawChat();drawStrip()}
function fill(t,it){return t.replace('{p}',Math.round(S.gboss.hp/S.gboss.max*100)).replace('{s}',S.stage+rnd(-3,8)).replace('{f}',S.forgeLvl+1).replace(/{me}/g,'you').replace(/{it}/g,it?it.name:'')}
function aiReact(k,it){if(!S.members.length)return;if(k=='drop'&&it.r<4&&Math.random()<.6)return;say(pick(S.members).name,1,fill(pick(CHAT[k]),it));save()}

function hitBoss(){if(S.hammers<1)return;S.hammers--;dmgBoss(stats().atk*20,'You',0);render()}
function dmgBoss(d,who,ai){const g=S.gboss;g.hp-=d;(g.log=g.log||{})[who]=(g.log[who]||0)+d;
 if(g.hp<=0){S.gold+=200*g.lvl;S.gems+=10;say('System',0,`Turf war won! Rival Don Lv${g.lvl} taken down. +$${200*g.lvl}, +10 diamonds`);g.lvl++;g.max=Math.round(g.max*1.5);g.hp=g.max;g.log={}}}
function aiTick(){S.ladder.forEach(a=>{if(Math.random()<.1){a.power+=rnd(5,60);if(Math.random()<.2)a.lvl++}});
 if(!S.guild)return;S.members.forEach(m=>{if(Math.random()<.15)dmgBoss(Math.round(m.power*rnd(2,6)),m.name,1);if(Math.random()<.05)m.power+=rnd(10,80)});
 const r=Math.random();
 if(r<.08)say(pick(S.members).name,1,fill(pick(Math.random()<.3?CHAT.recruit:CHAT.idle)));
 else if(r<.095&&S.members.length<20){const m=newAI(S.stage);S.members.push(m);say('System',0,m.name+' joined the family.')}
 else if(r<.1&&S.members.length>4){const m=S.members.splice(rnd(0,S.members.length-1),1)[0];say('System',0,m.name+' left the family.')}
 save();if(tab=='guild')render()}
function drawChat(){const c=$('chat');if(!c||!S.chat)return;c.innerHTML=S.chat.map(m=>`<div><b style="color:${m.who=='System'?'#ffd23a':'#8fd0ff'}">${m.who}</b>${m.ai?'<span class="ai">AI</span>':''}: ${m.txt}</div>`).join('');c.scrollTop=1e9}
function drawStrip(){const c=$('strip');if(!c)return;const m=S.chat[S.chat.length-1];c.innerHTML=m?`💬 <b style="color:#8fd0ff">${m.who}</b>${m.ai?'<span class="ai">AI</span>':''}: ${m.txt}`:'💬 Join a Family to chat'}
function sendChat(){const i=$('cmsg');if(!i.value)return;say('You',0,i.value.slice(0,100));i.value='';save();
 if(S.members.length)setTimeout(()=>{say(pick(S.members).name,1,pick(['ha true','same','you said it','capisce','hit the Don when you can','nice']));save()},rnd(1500,4000))}
function render(){hud();drawFoe();const v=$('panel'),s=stats();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 if(tab=='forge'){const w=rarW(),t=w.reduce((a,b)=>a+b);
  v.innerHTML=`<div class="grid" style="grid-template-columns:repeat(6,1fr);gap:5px">${SLOTS.map(sl=>tileHTML(S.gear[sl],sl)).join('')}</div>
  <div class="forge"><img src="${IMG.bench}"><div style="flex:1"><button class="btn" style="font-size:20px;padding:14px" onclick="forge()" ${S.hammers<1?'disabled':''}>Open Crate <img src="${IMG.crate}" style="height:24px;width:auto;vertical-align:middle"> 1</button>
  <button class="btn sm ${S.auto?'g':'b'}" onclick="toggleAuto()">Auto: ${S.auto?'ON':'OFF'}</button></div></div>
  <div class="chatstrip" id="strip"></div>
  <div class="card">Armory Lv ${S.forgeLvl} · ATK ${s.atk} · HP ${s.hp}<br><small>${RAR.map((r,i)=>`<span class="rt${i}">${r} ${(w[i]/t*100).toFixed(1)}%</span>`).join(' · ')}</small>
  <button class="btn sm g" onclick="upgrade()" ${S.gold<upCost()?'disabled':''}>Upgrade Armory ($${upCost().toLocaleString()})</button><small>+1 crate every 20s (max ${hmax()}). Auto equips upgrades and fences the rest.</small></div>`;drawStrip()}
 if(tab=='battle'){const e=B?B.e:enemy();v.innerHTML=`<div class="card"><h3>Block ${S.stage} ${e.boss?'<span style="color:#c62a1a">BOSS: Don Vittorio</span>':'vs '+e.name}</h3>Your crew fights automatically. A rival Don shows up every 10 blocks (drops 8 crates). Getting whacked drops you back a block.</div>
  <div class="grid">${FOES.map(f=>`<div class="tile re"><img src="${IMG[f[0]]}"><span class="lv ol">${f[1]}</span></div>`).join('')}<div class="tile r4"><img src="${IMG.boss}"><span class="lv ol">The Don</span></div></div>`}
 if(tab=='shop')v.innerHTML=`<div class="card" style="text-align:center"><span class="demo">DEMO STORE: NO REAL PAYMENTS</span></div>${SHOP.map((x,i)=>`<button class="btn ${i<3?'b':''}" onclick="buy(${i})" ${x[2]=='noads'&&S.noAds?'disabled':''}><img src="${IMG[SHOPI[i]]}" style="height:26px;vertical-align:middle"> ${x[0]} · ${x[3]}</button>`).join('')}<button class="btn sm g" onclick="gemSwap()">Trade 50 diamonds → 20 crates</button>`;
 if(tab=='guild'){if(!S.guild){v.innerHTML=`<div class="card"><input id="gname" placeholder="Family name"><button class="btn g" onclick="createG()">Start a Family</button></div><h3>Families recruiting</h3>${GN.map(g=>`<button class="btn sm b" onclick="joinG('${g}')">Join ${g} (${rnd(8,20)}/20)</button>`).join('')}<p style="font-size:11px">Simulated locally. Real families need a backend.</p>`;return}
  const g=S.gboss,log=Object.entries(g.log||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
  v.innerHTML=`<h3>${S.guild} <small>(${S.members.length+1} members)</small></h3>
  <div class="card"><div class="item"><img src="${IMG.boss}" style="height:70px"><div style="flex:1">Turf War: Rival Don Lv${g.lvl}<div class="hb" style="width:100%"><i style="width:${g.hp/g.max*100}%"></i></div><small>${g.hp.toLocaleString()} / ${g.max.toLocaleString()}</small></div></div>
  <button class="btn sm r" onclick="hitBoss()">Hit him (1 crate, ${(s.atk*20).toLocaleString()} dmg)</button><small>Top damage: ${log.map(([n,d])=>n+' '+d.toLocaleString()).join(', ')||'none yet'}</small></div>
  <div id="chat"></div><div style="display:flex;gap:6px;margin-top:6px"><input id="cmsg" placeholder="Say something"><button class="btn sm" style="width:80px;margin:0" onclick="sendChat()">Send</button></div>
  <h3 style="margin-top:8px">Members</h3>${[{name:'You',lvl:S.stage,power:s.power}].concat(S.members).sort((a,b)=>b.power-a.power).map(m=>`<div class="row"><span>${m.name}${m.ai?'<span class="ai">AI</span>':''} · Lv${m.lvl}</span><span>${m.power.toLocaleString()}</span></div>`).join('')}
  <button class="btn sm r" onclick="leaveG()">Leave Family</button><p style="font-size:11px">AI-simulated members (tagged AI).</p>`;drawChat()}
 if(tab=='world'){const lad=S.ladder.concat([{name:'You',lvl:S.stage,power:s.power}]).sort((a,b)=>b.power-a.power);
  v.innerHTML=`<h3>Cities</h3>${SERVERS.map((x,i)=>`<button class="btn sm ${i==S.server?'g':'b'}" onclick="setServer(${i})">${x.n} · ${popLabel(x.base)}</button>`).join('')}
  <h3 style="margin-top:8px"><img src="${IMG.crown}" style="height:22px;vertical-align:middle"> Most Feared</h3>${lad.map((m,i)=>`<div class="row" style="${m.ai?'':'color:#d07a00'}"><span>#${i+1} ${m.name}${m.ai?'<span class="ai">AI</span>':''} · Lv${m.lvl} <small class="rt${RAR.indexOf(m.gear)}">${m.gear||''}</small></span><span>${m.power.toLocaleString()}</span></div>`).join('')}
  <p style="font-size:11px">Population and players are simulated.</p>`}}
$('arena').style.backgroundImage=`url(${IMG.bg})`;$('heroimg').src=IMG.hero;$('av').style.backgroundImage=`url(${IMG.avatar})`;$('icash').src=IMG.cash;$('idia').src=IMG.dia;$('icrate').src=IMG.crate;
document.querySelectorAll('nav img').forEach(i=>i.src=IMG[i.dataset.i]);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('modal').onclick=e=>{if(e.target.id=='modal')closeM()};
const off=Math.floor((Date.now()-S.last)/20000);if(off>0)S.hammers=Math.max(S.hammers,Math.min(hmax(),S.hammers+off));
setInterval(()=>{if(S.hammers<hmax())S.hammers++;save();hud()},20000);
setInterval(()=>{if(S.auto&&S.hammers>0&&$('modal').style.display!='flex')forge()},1200);
setInterval(tick,700);setInterval(aiTick,2000);setInterval(drift,3000);
drift();startFight();render();
</script></body></html>
